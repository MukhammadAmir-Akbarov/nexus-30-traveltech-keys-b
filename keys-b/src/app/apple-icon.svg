<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Иконка для iOS: «Добавить на экран Домой» берёт именно apple-icon.
    Без неё Safari рисует уменьшенный скриншот страницы, и ярлык выглядит
    как случайная вкладка, а не как приложение.

    Отличие от public/icon.svg — сплошная подложка без скруглений: iOS
    скругляет сам, и собственный радиус даёт двойную рамку.
  -->
  <rect width="512" height="512" fill="#0d7a75"/>
  <path d="M256 96c-53 0-96 43-96 96 0 72 96 224 96 224s96-152 96-224c0-53-43-96-96-96z" fill="#fff" opacity=".95"/>
  <circle cx="256" cy="188" r="40" fill="#0d7a75"/>
</svg>

# Render Blueprint. Dashboard: New → Blueprint → выбрать этот репозиторий.
# Код лежит в подпапке keys-b, поэтому задан rootDir.
services:
  - type: web
    name: turizm-hamroh
    runtime: node
    plan: free
    region: frankfurt # ближайший к Узбекистану регион Render

    # Ветка деплоя — elbek, а не cyber. Почему так на 16 августа:
    # cyber и elbek разошлись (у cyber 2 коммита с фотографиями и бюджетом,
    # у elbek 13 — узбекский поиск, вердикт по правилам, startRegion, формат
    # «пара», подбор гида, подпись сессии). Слияние даёт конфликты в шести
    # файлах, а публичный адрес нужен раньше, чем закончится это слияние.
    # После слияния вернуть сюда cyber — autoDeploy подхватит сам.
    branch: elbek
    rootDir: keys-b
    # --include=dev обязателен. На Render у Node-сервисов NODE_ENV=production,
    # а при нём npm сам выставляет omit=dev — измерено на npm 10.9.8:
    #   NODE_ENV=production      npm config get omit  →  dev
    #   NODE_ENV=production --include=dev             →  (пусто)
    # typescript, tailwindcss и @tailwindcss/postcss лежат в devDependencies,
    # то есть без этого флага `next build` падает на отсутствующем компиляторе.
    # Берём --include=dev, а не NPM_CONFIG_PRODUCTION=false: последний npm
    # помечает устаревшим («Use `--omit=dev` instead») и печатает warning.
    buildCommand: npm ci --include=dev && npm run build
    # Render передаёт порт в $PORT — next start по умолчанию слушает 3000, поэтому порт задаём явно
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Секрет подписи сессий. Без него auth.ts берёт предсказуемый dev-секрет,
      # и на публичном адресе cookie администратора подделывается вручную.
      # generateValue — Render создаёт случайное значение при первом деплое.
      - key: SESSION_SECRET
        generateValue: true

      # Пароль администратора. Без него store.ts ставит демо-пароль nexus30,
      # а страница входа его же и показывает — на постоянном адресе это значит,
      # что администратором становится любой открывший ссылку.
      # Значение смотреть в дашборде: Environment → SESSION/ADMIN.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@nexus30.uz

      # Ключ модели задаётся в дашборде. Без него приложение работает по правилам
      # и предзаписанным ответам — это штатный режим, а не поломка.
      - key: AI_GATEWAY_API_KEY
        sync: false

# Render Blueprint. Dashboard: New → Blueprint → выбрать этот репозиторий.
# Код лежит в подпапке keys-b, поэтому задан rootDir.
services:
  - type: web
    name: turizm-hamroh
    runtime: node
    plan: free
    region: frankfurt # ближайший к Узбекистану регион Render
    branch: cyber
    rootDir: keys-b
    buildCommand: npm ci && npm run build
    # Render передаёт порт в $PORT — next start по умолчанию слушает 3000, поэтому порт задаём явно
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Секрет подписи сессий. Без него auth.ts берёт предсказуемый dev-секрет,
      # и на публичном адресе cookie администратора подделывается вручную.
      # generateValue — Render создаёт случайное значение при первом деплое.
      - key: SESSION_SECRET
        generateValue: true

      # Пароль администратора. Без него store.ts ставит демо-пароль nexus30,
      # а страница входа его же и показывает — на постоянном адресе это значит,
      # что администратором становится любой открывший ссылку.
      # Значение смотреть в дашборде: Environment → SESSION/ADMIN.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@nexus30.uz

      # Ключ модели задаётся в дашборде. Без него приложение работает по правилам
      # и предзаписанным ответам — это штатный режим, а не поломка.
      - key: AI_GATEWAY_API_KEY
        sync: false
